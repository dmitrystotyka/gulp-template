<!--- All params are required. WebP siblings are generated by the build.
     AVIF: enable images.avif in project.config.js and add above the webp source:
     <source type="image/avif" srcset="..." /> --->
<picture>
  <source type="image/webp" srcset="@@src.webp" />
  <img class="@@class" src="@@src.@@ext" alt="@@alt" loading="@@loading" width="@@width" height="@@height" />
</picture>
