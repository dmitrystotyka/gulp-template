<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>@@title</title>
<meta name="description" content="@@description" />
<!-- Canonical URL and og:url are resolved by the build from SITE_URL + page path -->
<link rel="canonical" href="__PAGE_URL__" />

<!-- Open Graph (image paths are made absolute by the build) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="__PAGE_URL__" />
<meta property="og:title" content="@@title" />
<meta property="og:description" content="@@description" />
<meta property="og:image" content="@@image" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="@@title" />
<meta name="twitter:description" content="@@description" />
<meta name="twitter:image" content="@@image" />

<link rel="icon" href="./assets/favicon.ico" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

@@if (criticalCss) {
<style>
  /* __CRITICAL_CSS__ */
</style>
}
<link rel="stylesheet" href="./styles/normalize.css" />
<link rel="stylesheet" href="./styles/vars.css" />
<link rel="stylesheet" href="./styles/fonts.css" />
<link rel="stylesheet" href="./styles/utils.css" />
<link rel="stylesheet" href="./styles/ui.css" />
<link rel="stylesheet" href="./styles/main.css" />
@@if (tailwind) {
<link rel="stylesheet" href="./styles/tailwind.css" />
} @@if (tailwindCdn) { @@include('layouts/_tailwind-cdn.html') }
