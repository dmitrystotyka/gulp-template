# Supply-chain protection: only install package versions published at least
# 3 days ago (4320 min). Bypass for a hotfix: pnpm add <pkg> --config.minimum-release-age=0
minimumReleaseAge: 4320

# pnpm 10 blocks install scripts unless allow-listed. Nothing in this tree
# needs one today (sharp, lightningcss and sass-embedded ship prebuilt
# binaries via optionalDependencies) — audit before adding a package here.
onlyBuiltDependencies: []
